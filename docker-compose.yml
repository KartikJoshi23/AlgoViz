# AlgoViz — local stack.
#   docker compose up --build                       # live Binance feed
#   DATA_SOURCE=synthetic docker compose up --build # no internet needed
#   Backend  → http://localhost:8002   (host 8002 → container 8000)
#   Frontend → http://localhost:3002   (host 3002 → container 3000)
#
# The browser talks to the backend directly, so the frontend image is built
# with the *host* backend origin (build args below). Change them if you
# publish the backend on a different host port.
services:
  backend:
    build:
      context: ./backend
    container_name: algoviz-backend
    ports:
      - "8002:8000"
    volumes:
      - backend_data:/app/data
      - ml_models:/app/ml_models
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATA_SOURCE: ${DATA_SOURCE:-live}
      SYMBOLS: '["BTCUSDT"]'
      # DATABASE_URL defaults to /app/data/algoviz.db for live and to
      # /app/data/algoviz-<source>.db for synthetic / replay (kept apart on purpose)
      CORS_ORIGINS: '["http://localhost:3002","http://127.0.0.1:3002","http://localhost:3000","http://127.0.0.1:3000"]'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8002/ws}
    container_name: algoviz-web
    ports:
      - "3002:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  ml_models:
