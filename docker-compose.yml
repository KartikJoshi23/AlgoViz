# ═══════════════════════════════════════════════════════════════════
# AlgoViz — Docker Compose (Development)
# ═══════════════════════════════════════════════════════════════════
# Run:  docker-compose up --build
# Stop: docker-compose down
# Ports: Backend → localhost:8002, Frontend → localhost:3002
# Note: Smart Contract Scanner uses 8001/3001 — AlgoViz uses 8002/3002
# ═══════════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algoviz-backend
    ports:
      - "8002:8000" # Host 8002 → Container 8000 (avoids conflict with Smart Contract Scanner on 8001)
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - ml_models:/app/ml_models
    environment:
      - DEBUG=true
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///data/algoviz.db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Frontend (React + Vite) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algoviz-frontend
    ports:
      - "3002:3002" # Host 3002 → Container 3002 (avoids conflict with Smart Contract Scanner on 3001)
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:8000
    restart: unless-stopped

volumes:
  backend_data:
  ml_models:
