name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (ruff · mypy · pytest + coverage · pip-audit)
    runs-on: ubuntu-24.04
    # Every job is bounded: a hang fails in minutes instead of running for six hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - run: pip install --upgrade pip setuptools wheel
      # the same transitive versions Render and the Docker image install
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: pytest with coverage (floor in pyproject.toml)
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14
      - name: pip-audit (the whole pinned runtime set, transitive included)
        run: pip-audit -r requirements.txt -r constraints.txt --strict --desc on
      - name: OpenAPI document is up to date
        run: |
          python scripts/export_openapi.py /tmp/openapi.json
          python - <<'EOF'
          import json
          fresh = json.load(open("/tmp/openapi.json"))
          committed = json.load(open("../frontend/lib/api/openapi.json"))
          assert fresh == committed, "frontend/lib/api/openapi.json is stale — run scripts/export_openapi.py and npm run types"
          EOF

  frontend:
    name: Frontend (prettier · tsc · eslint · vitest · next build · npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run types
          git diff --exit-code --ignore-cr-at-eol -- lib/api/schema.d.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: npm audit (what ships)
        run: npm audit --omit=dev --audit-level=high
      # Dev tooling is reported, not blocking: braces ≤ 3.0.3 (via eslint-config-next) has a
      # high advisory and no patched release (2026-10-07). Make this blocking again once it does.
      - name: npm audit (dev tooling, reported)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: End-to-end (Playwright · synthetic backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --upgrade pip setuptools wheel && pip install -e ./backend -c backend/constraints.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "1"
          ALGOVIZ_PYTHON: python
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          # one cache scope per image: a shared scope lets each build evict the other's layers
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8002
            NEXT_PUBLIC_WS_URL=ws://localhost:8002/ws
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
