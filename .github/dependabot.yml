# Weekly dependency updates. Minor and patch bumps arrive grouped, one PR per ecosystem;
# a major version gets a PR of its own, so it is reviewed rather than merged with the rest.
# Every PR runs the full CI gate (tests, pip-audit / npm audit, e2e, image builds).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # The types follow the runtime: Node 22 in CI, Docker and `engines` (newer types
      # would accept APIs Node 22 lacks, and type-check green).
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Blocked upstream (2026-10-09). ESLint 10 removed context.getFilename(), which
      # eslint-plugin-react (inside eslint-config-next) still calls; typescript-eslint
      # accepts typescript <6.1. Drop each rule once its blocker ships a fix.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    # The runtimes move deliberately, together with CI and the hosts (Python 3.11 on
    # Render and in CI, Node 22 in CI): CI builds these images but tests on its own runtime,
    # so a green image build says nothing about a new interpreter.
    ignore:
      - dependency-name: python
        versions: [">=3.12"]
      - dependency-name: node
        versions: [">=23"]
